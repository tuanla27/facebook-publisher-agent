name: quality

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check:schemas
      - run: npm run check:input -- inputs/example-post-job.json
      - run: npm run check:input -- inputs/my-first-post-job.json
      - run: npm run check:quality -- fixtures/example-generated-post.json
      - run: npm test
